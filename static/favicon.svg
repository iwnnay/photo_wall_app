<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="photo wall">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a82d6"/>
      <stop offset="100%" stop-color="#1d2f7a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5d6"/>
      <stop offset="45%" stop-color="#f3c969"/>
      <stop offset="100%" stop-color="#b6862f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- ornate outer frame -->
  <rect x="8" y="10" width="48" height="44" rx="3" fill="none" stroke="url(#gold)" stroke-width="3.2"/>
  <!-- inner bevel -->
  <rect x="12" y="14" width="40" height="36" rx="1.5" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.85"/>
  <!-- ornamental corner dots -->
  <circle cx="11" cy="13" r="1.6" fill="url(#gold)"/>
  <circle cx="53" cy="13" r="1.6" fill="url(#gold)"/>
  <circle cx="11" cy="51" r="1.6" fill="url(#gold)"/>
  <circle cx="53" cy="51" r="1.6" fill="url(#gold)"/>
  <!-- script lowercase f -->
  <text x="32" y="46" text-anchor="middle"
        font-family="'Brush Script MT','Lucida Handwriting','Segoe Script',cursive"
        font-style="italic" font-weight="700" font-size="34" fill="#ffffff">f</text>
</svg>
